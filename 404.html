<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>404 · 연구 많이 된다</title>
  <script>
    // /thinkmany/ch05 or /thinkmany/ch05/섹션 -> the reader's hash route
    (function () {
      var m = location.pathname.match(/^\/thinkmany\/(ch\d+)(?:\/(.+?))?\/?$/);
      if (m) location.replace('/thinkmany/#' + m[1] + (m[2] ? '/' + m[2] : ''));
    })();
  </script>
  <link rel="icon" href="/thinkmany/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <style>
    :root {
      --bg: #fbfbfa; --fg: #1b1c1f; --muted: #696c74; --line: #e7e6e2;
      --card: #ffffff; --accent: #4f46e5; --on-accent: #fff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111214; --fg: #ededf0; --muted: #9a9ca5; --line: #24262a;
        --card: #17181b; --accent: #908cff; --on-accent: #0f1013;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
      background: var(--bg);
      color: var(--fg);
      font-family: 'Pretendard Variable', Pretendard, -apple-system, system-ui, 'Apple SD Gothic Neo', sans-serif;
      line-height: 1.7;
      word-break: keep-all;
    }
    main { max-width: 34rem; }
    img { display: block; margin-bottom: 1.5rem; border-radius: 12px; }
    .code { color: var(--accent); font-weight: 700; font-size: 0.9rem; }
    h1 { margin-top: 0.4rem; font-size: 1.9rem; line-height: 1.3; letter-spacing: -0.03em; }
    p { margin-top: 0.75rem; color: var(--muted); }
    blockquote {
      margin-top: 1.5rem;
      padding: 1rem 1.15rem;
      border: 1px solid var(--line);
      border-left: 3px solid var(--accent);
      border-radius: 8px;
      background: var(--card);
      color: var(--muted);
      font-size: 0.92rem;
    }
    blockquote strong { color: var(--fg); }
    .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 1.75rem; }
    a.btn {
      display: inline-flex; align-items: center; min-height: 44px; padding: 0 1.1rem;
      border: 1px solid var(--line); border-radius: 10px;
      color: var(--fg); font-weight: 600; text-decoration: none;
    }
    a.btn.primary { border-color: transparent; background: var(--accent); color: var(--on-accent); }
  </style>
</head>
<body>
  <main>
    <img src="/thinkmany/assets/favicon.svg" alt="" width="48" height="48">
    <p class="code">404</p>
    <h1>이 페이지는 본인의 분야가 아닌 것 같다</h1>
    <p>찾는 페이지가 없거나 주소가 바뀌었습니다.</p>
    <blockquote>
      <strong>논문 읽기의 원칙 하나.</strong> 모든 논문을 이해할 필요는 없다. 첫 번째 패스에서 “내 분야가 아니다” 싶으면 10분 안에 넘어간다. 이 페이지도 그런 논문이다.
    </blockquote>
    <div class="actions">
      <a class="btn primary" href="/thinkmany/">차례로 돌아가기</a>
      <a class="btn" href="/thinkmany/#ch01">첫 장 읽기</a>
    </div>
  </main>
</body>
</html>
