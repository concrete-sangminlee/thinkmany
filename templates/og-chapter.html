<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- Source for assets/og/chNN.jpg. Rendered by scripts/render-images.mjs ({{...}} are filled in). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    overflow: hidden;
    padding: 72px 88px;
    background:
      radial-gradient(760px 460px at 92% 8%, color-mix(in srgb, {{color}} 30%, transparent) 0%, transparent 62%),
      linear-gradient(160deg, #17172b, #0f1016 72%);
    color: #ededf0;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    word-break: keep-all;
  }
  .brand { display: flex; align-items: center; gap: 14px; color: #a7a9b4; font-size: 24px; font-weight: 700; }
  .brand img { width: 40px; height: 40px; border-radius: 10px; }
  .part { margin-top: 64px; color: {{color}}; font-size: 26px; font-weight: 700; }
  .num { position: absolute; right: 80px; bottom: 40px; color: rgba(255,255,255,0.06); font-size: 300px; font-weight: 800; line-height: 1; letter-spacing: -0.04em; }
  h1 { margin-top: 18px; max-width: 980px; font-size: {{size}}px; font-weight: 800; line-height: 1.15; letter-spacing: -0.035em; }
  .lead { margin-top: 22px; max-width: 900px; overflow: hidden; color: #9a9ca5; font-size: 30px; line-height: 1.4; white-space: nowrap; text-overflow: ellipsis; }
  .meta { position: absolute; left: 88px; bottom: 64px; color: #6f7280; font-size: 22px; }
</style>
</head>
<body>
  <div class="brand"><img src="{{mark}}" alt="">연구 많이 된다</div>
  <p class="part">Part {{part}} · {{partTitle}}</p>
  <h1>{{title}}</h1>
  <p class="lead">{{lead}}</p>
  <p class="meta">{{meta}}</p>
  <div class="num">{{num}}</div>
</body>
</html>
