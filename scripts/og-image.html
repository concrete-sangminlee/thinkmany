<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<!-- Source for assets/og-image.png. Rendered by scripts/render-images.mjs ({{...}} are filled in). -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative;
    overflow: hidden;
    padding: 84px 96px;
    background: radial-gradient(900px 520px at 85% 10%, #2c2a5c 0%, transparent 60%), linear-gradient(160deg, #17172b, #0f1016 70%);
    color: #ededf0;
    font-family: 'Pretendard Variable', Pretendard, sans-serif;
    word-break: keep-all;
  }
  .mark { position: absolute; top: 72px; right: 96px; width: 132px; height: 132px; }
  .eyebrow { color: #a9a5ff; font-size: 26px; font-weight: 700; letter-spacing: 0.01em; }
  h1 { margin-top: 30px; font-size: 104px; font-weight: 800; line-height: 1.05; letter-spacing: -0.04em; }
  h1 span { display: block; margin-top: 10px; color: #8a8c98; font-weight: 700; }
  .meta { position: absolute; left: 96px; right: 96px; bottom: 76px; display: flex; justify-content: space-between; align-items: end; padding-top: 28px; border-top: 1px solid #2c2e36; }
  .stats { display: flex; gap: 48px; }
  .stats b { display: block; font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
  .stats small { color: #9a9ca5; font-size: 22px; }
  .url { color: #6f7280; font-size: 22px; }
</style>
</head>
<body>
  <img class="mark" src="../assets/favicon.svg" alt="">
  <p class="eyebrow">한국 공학 대학원 실전 가이드</p>
  <h1>연구 많이 된다<span>잘 때도 생각날 거야</span></h1>
  <div class="meta">
    <div class="stats">
      <div><b>{{chapters}}</b><small>장</small></div>
      <div><b>{{parts}}</b><small>파트</small></div>
      <div><b>{{sections}}</b><small>섹션</small></div>
      <div><b>약 {{hours}}시간</b><small>분량</small></div>
    </div>
    <p class="url">concrete-sangminlee.github.io/thinkmany</p>
  </div>
</body>
</html>
